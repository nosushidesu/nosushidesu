<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projects · nosushidesu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .filters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:12px}
  .filters button{font:600 .92rem var(--round);color:var(--ink);cursor:pointer;border:0;padding:8px 16px;border-radius:999px;background:var(--c,#fff);box-shadow:0 0 0 2.5px #fff,var(--shadow);transition:transform .15s}
  .filters button:hover{transform:translateY(-2px)}
  .filters button.on{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--hot),var(--shadow);transform:scale(1.06)}
  .cat-desc{text-align:center;font-family:var(--hand);font-size:1.35rem;font-weight:700;margin:8px 0 30px;min-height:30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px}
  .proj{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards;display:block;transition:transform .2s}
  .proj:nth-child(3n+1){--r:-2deg} .proj:nth-child(3n+2){--r:1.5deg} .proj:nth-child(3n){--r:-.8deg}
  .proj{transform:rotate(var(--r))}
  .proj:hover{transform:rotate(0) translateY(-6px)}
  .proj .polaroid{transition:transform .2s}
  .proj .ph{font-size:4rem;aspect-ratio:4/3}
  .proj .info{padding:14px 4px 0}
  .proj h3{font-size:1.15rem;margin:6px 0 4px}
  .proj p{font-size:.92rem;font-weight:500;color:var(--ink-soft)}
  .proj .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .st{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px}
  .st.ongoing{background:var(--mint)} .st.upcoming{background:var(--butter)} .st.done{background:var(--lilac)}
  .proj .polaroid{padding-bottom:16px}
  @keyframes pop{from{opacity:0;transform:scale(.85) rotate(var(--r))}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="dot">🍣</span><b>nosushidesu</b></a>
    <ul class="tabs">
      <li><a href="/">home</a></li>
      <li><a href="/projects.html">projects</a></li>
      <li><a href="/events.html">events</a></li>
      <li><a href="/#links">links</a></li>
    </ul>
  </div>
</nav>

<main class="wrap">
  <section>
    <div class="sec-title"><span class="label">made with love for JJ</span><h2>project archive</h2></div>
    <div class="filters" id="filters"></div>
    <p class="cat-desc" id="desc"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="foot"><div class="paper scallop"><span class="tape stripe tl"></span><p class="hand" style="font-size:1.4rem;color:var(--ink)">made with love for JJ ♡</p><p>nosushidesu · fan-made, non-profit</p></div></footer>

<script src="/assets/deco.js"></script>
<script src="/assets/app.js"></script>
<script>
const $=s=>document.querySelector(s);
const ST={ongoing:'ongoing ✦',upcoming:'coming soon',done:'done ♡'};
const TAPES=['check','stripe','dots','peri'];
NSD.getJSON('/data/projects.json').then(d=>{
  const cats=[{id:'all',label:'semua',icon:'💖',color:'#fff',desc:'semua project yang pernah & sedang aku kerjain ♡'},...d.categories];
  const byId=Object.fromEntries(d.categories.map(c=>[c.id,c]));
  let cur=new URLSearchParams(location.search).get('c')||'all';
  if(!cats.find(c=>c.id===cur)) cur='all';

  function render(){
    $('#filters').innerHTML=cats.map(c=>`<button class="${c.id===cur?'on':''}" style="--c:${c.color}" data-c="${c.id}">${c.icon} ${NSD.esc(c.label)}</button>`).join('');
    const cat=cats.find(c=>c.id===cur); $('#desc').textContent=cat.desc||'';
    const list=d.projects.filter(p=>cur==='all'||p.category===cur).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    $('#grid').innerHTML = list.length ? list.map((p,i)=>{
      const c=byId[p.category]||{icon:'✦',color:'#fff',label:p.category};
      const ph=p.image?`<img src="${NSD.esc(p.image)}" alt="">`:`<span>${c.icon}</span>`;
      const tag=p.link?'a':'div';
      return `<${tag} class="proj" ${p.link?`href="${NSD.esc(p.link)}" target="_blank" rel="noopener" style="text-decoration:none;animation-delay:${i*60}ms"`:`style="animation-delay:${i*60}ms"`}>
        <div class="polaroid"><span class="tape ${TAPES[i%4]} tc"></span>
          <div class="ph" style="background:${c.color}">${ph}</div>
          <div class="info">
            <div class="row"><span class="stamp">${NSD.esc(c.label)}</span><span class="st ${p.status}">${ST[p.status]||''}</span></div>
            <h3>${NSD.esc(p.title)}</h3>
            <p>${NSD.esc(p.desc)}</p>
            <p style="margin-top:6px;font-weight:700">${NSD.fmtDate(p.date).full}</p>
          </div></div></${tag}>`;
    }).join('') : `<p class="empty" style="grid-column:1/-1">belum ada project di sini, stay tuned ya ✦</p>`;
  }
  $('#filters').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    cur=b.dataset.c; history.replaceState(null,'',cur==='all'?'/projects.html':'?c='+cur); render();
  });
  render();
});
</script>
</body>
</html>
